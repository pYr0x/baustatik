name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    name: Build, Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@5
        with:
          version: 11.16.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      
      - name: Setup Rust
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browser-Verhaltenstests (z.B. @baustatik/konva-adapter) laufen in
      # Chromium. Sie vergleichen keine Pixel und sind daher plattformunabhaengig;
      # Screenshot-Baselines bleiben lokal (`pnpm test:screenshot`).
      - name: Install Playwright Chromium
        run: pnpm --filter @baustatik/konva-adapter exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
