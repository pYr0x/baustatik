name: CI / CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  # Optional: Erlaubt manuelles Triggern über GitHub UI
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build, Lint and Test
    runs-on: ubuntu-latest
    if: "!startsWith(github.head_ref, 'changeset-release/')"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://wasm-bindgen.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Read Emscripten pin
        id: emscripten
        run: |
          version=$(node -p "require('./packages/mesh-2d-wasm/toolchain.json').emscriptenVersion")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Emscripten SDK and system libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.emsdk
            ~/.cache/emscripten
          key: ${{ runner.os }}-emscripten-${{ hashFiles('packages/mesh-2d-wasm/toolchain.json') }}

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@667eb33f24e84e7f362c16d8d7fff0629a73e15e
        with:
          version: ${{ steps.emscripten.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browser-Verhaltenstests (z.B. @baustatik/konva-adapter) laufen in
      # Chromium. Sie vergleichen keine Pixel und sind daher plattformunabhaengig;
      # Screenshot-Baselines bleiben lokal (`pnpm test:screenshot`).
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @baustatik/konva-adapter exec playwright --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @baustatik/konva-adapter exec playwright install --with-deps chromium

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # ADR 0036: bis zur ersten Freigabe ist jeder Changeset 'patch'. Ein
      # major/minor-Label ist ein Versionsentscheid, den es ohne Abnehmer nicht gibt.
      # Das Skript parst das Frontmatter robust (einfache/doppelte/keine Anfuehrungszeichen).
      - name: Changesets are patch-only until the first release (ADR 0036)
        run: node scripts/check-release-policy.mjs

      - name: Run Turbo Pipeline (Build, Lint, Typecheck, Test)
        run: pnpm turbo run build typecheck lint test --cache-dir=.turbo/cache --summarize

      # Build-Artefakte für nachgelagerte Jobs (Deploy & Release) auf main sichern
      - name: Upload Build Artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          retention-days: 1
          path: |
            packages/*/dist
            packages/*/pkg
            apps/demo/dist

  deploy:
    name: Deploy to Cloudflare Pages (Production)
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  release:
    name: Release
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Verify WASM package contents
        run: |
          pnpm --filter @baustatik/linear-solver-wasm exec npm pack --dry-run
          pnpm --filter @baustatik/mesh-2d-wasm exec npm pack --dry-run
          pnpm --filter @baustatik/sparse-solver-wasm exec npm pack --dry-run

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm publish-packages
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
