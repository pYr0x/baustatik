name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches-ignore:
      - "changeset-release/**"
    types: [opened, synchronize]

jobs:
  build:
    name: Build, Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://wasm-bindgen.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Read Emscripten pin
        id: emscripten
        run: |
          version=$(node -p "require('./packages/mesh-2d-wasm/toolchain.json').emscriptenVersion")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Emscripten SDK and system libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.emsdk
            ~/.cache/emscripten
          key: ${{ runner.os }}-emscripten-${{ hashFiles('packages/mesh-2d-wasm/toolchain.json') }}

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@667eb33f24e84e7f362c16d8d7fff0629a73e15e
        with:
          version: ${{ steps.emscripten.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browser-Verhaltenstests (z.B. @baustatik/konva-adapter) laufen in
      # Chromium. Sie vergleichen keine Pixel und sind daher plattformunabhaengig;
      # Screenshot-Baselines bleiben lokal (`pnpm test:screenshot`).
      - name: Install Playwright Chromium
        run: pnpm --filter @baustatik/konva-adapter exec playwright install --with-deps chromium

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # ADR 0036: bis zur ersten Freigabe ist jeder Changeset 'patch'. Ein
      # major/minor-Label ist ein Versionsentscheid, den es ohne Abnehmer nicht gibt.
      # Das Skript parst das Frontmatter robust (einfache/doppelte/keine Anfuehrungszeichen).
      - name: Changesets are patch-only until the first release (ADR 0036)
        run: node scripts/check-release-policy.mjs

      - name: Run Turbo Pipeline (Build, Lint, Typecheck, Test)
        run: pnpm turbo run build typecheck lint test
