<!doctype html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FEM-Scripting POC</title>
    <script src="./fem-scripting.ts" type="module"></script>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
            background: #111316;
            color: #e7e9ec;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        main {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(420px, 1fr);
            height: 100%;
        }

        #viewer {
            min-width: 0;
            background: #f5f2eb;
            border-right: 1px solid #30343a;
        }

        .workspace {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            min-width: 0;
            background: #1e1e1e;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.7rem 0.9rem;
            border-bottom: 1px solid #30343a;
            background: #181a1e;
        }

        .title {
            font-size: 0.86rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        button {
            border: 1px solid #74b88a;
            border-radius: 4px;
            padding: 0.52rem 0.8rem;
            background: #28613d;
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: #347c4f;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.6;
        }

        #editor {
            min-width: 0;
            min-height: 0;
        }

        .result {
            min-height: 5.2rem;
            max-height: 11rem;
            overflow: auto;
            padding: 0.65rem 0.9rem;
            border-top: 1px solid #30343a;
            background: #181a1e;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 0.8rem;
        }

        #status {
            color: #c5cbd3;
        }

        #status[data-kind="success"] {
            color: #89d49f;
        }

        #status[data-kind="error"] {
            color: #ff9b95;
        }

        #problems {
            margin: 0.4rem 0 0;
            padding-left: 1.2rem;
            color: #ffcbc7;
        }

        @media (max-width: 820px) {
            body {
                overflow: auto;
            }

            main {
                grid-template-columns: 1fr;
                grid-template-rows: 42vh 58vh;
                min-height: 720px;
            }

            #viewer {
                border-right: 0;
                border-bottom: 1px solid #30343a;
            }
        }
    </style>
</head>

<body>
    <main>
        <div id="viewer"></div>
        <section class="workspace" aria-label="TypeScript-Modellskript">
            <header class="toolbar">
                <span class="title">@baustatik/script</span>
                <button id="run-script" type="button" title="Strg+Enter">Ausführen</button>
            </header>
            <div id="editor"></div>
            <section class="result" aria-live="polite">
                <div id="status">Bereit.</div>
                <ul id="problems"></ul>
            </section>
        </section>
    </main>
</body>

</html>
